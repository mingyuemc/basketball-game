<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hoops Arena · 半场 3D 篮球</title>
  <style>
    :root { --accent: #ff8a1e; --accent2: #34e0a1; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; }
    body { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; color: #fff; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }
    #scoreboard {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 14px;
      padding: 8px 22px; border-radius: 14px;
      background: rgba(10, 14, 22, .72); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
      font-weight: 700; letter-spacing: .5px;
    }
    #scoreboard .team { font-size: 13px; opacity: .85; }
    #scoreboard .team.a { color: var(--accent2); }
    #scoreboard .team.b { color: #ff6b6b; }
    #scoreboard .num { font-size: 30px; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
    #scoreboard .colon { opacity: .4; font-size: 22px; }

    #clocks {
      position: absolute; top: 78px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center;
    }
    .clock {
      padding: 5px 14px; border-radius: 10px; font-variant-numeric: tabular-nums;
      background: rgba(10,14,22,.66); border: 1px solid rgba(255,255,255,.07);
      font-size: 15px; font-weight: 700;
    }
    #shotClock.warn { color: #ff5252; border-color: rgba(255,82,82,.55); animation: pulse .6s infinite; }
    @keyframes pulse { 50% { opacity: .45; } }

    #powerWrap {
      position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
      width: 320px; height: 16px; border-radius: 9px; overflow: hidden;
      background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16);
      opacity: 0; transition: opacity .18s;
      box-shadow: 0 6px 20px rgba(0,0,0,.4);
    }
    #powerWrap.active { opacity: 1; }
    #perfectZone { position: absolute; top: -3px; bottom: -3px; background: rgba(52,224,161,.45); border-left: 2px solid rgba(52,224,161,.9); border-right: 2px solid rgba(52,224,161,.9); border-radius: 4px; }
    #powerFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg,#ffd166,#ff8a1e); }

    #msg {
      position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%) scale(.9);
      font-size: 46px; font-weight: 900; letter-spacing: 2px; opacity: 0;
      text-shadow: 0 6px 24px rgba(0,0,0,.7);
      transition: opacity .22s, transform .22s;
    }
    #msg.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

    #hint {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-size: 12.5px; opacity: .6; white-space: nowrap;
      background: rgba(10,14,22,.5); padding: 6px 14px; border-radius: 8px;
    }
    #fps { position: absolute; top: 14px; right: 16px; font-size: 12px; opacity: .45; font-variant-numeric: tabular-nums; }

    /* ---------- 开始菜单 ---------- */
    #menu {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px; text-align: center;
      background: radial-gradient(circle at 50% 35%, #1b2433 0%, #0b0e14 70%);
    }
    #menu.hidden { display: none; }
    #menu h1 { font-size: 54px; letter-spacing: 3px; font-weight: 900; }
    #menu h1 span { color: var(--accent); }
    #menu p.sub { opacity: .6; font-size: 14px; margin-top: -14px; }
    .optRow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .opt { padding: 11px 26px; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 700;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); transition: .15s; }
    .opt:hover { background: rgba(255,255,255,.13); }
    .opt.selected { background: var(--accent); border-color: var(--accent); color: #1a1206; }
    #playBtn {
      pointer-events: auto; margin-top: 6px; padding: 15px 60px; font-size: 19px; font-weight: 900;
      letter-spacing: 2px; border-radius: 14px; cursor: pointer; border: none;
      background: linear-gradient(135deg, #ff9d3d, #ff6a00); color: #241300;
      box-shadow: 0 10px 30px rgba(255,120,0,.35);
    }
    #playBtn:hover { filter: brightness(1.08); }
    .label { font-size: 13px; opacity: .55; letter-spacing: 1px; }
    .brand-note { position: absolute; bottom: 18px; font-size: 12px; opacity: .35; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="scoreboard">
      <span class="team a">YOU</span>
      <span class="num" id="scoreA">0</span>
      <span class="colon">:</span>
      <span class="num" id="scoreB">0</span>
      <span class="team b">CPU</span>
    </div>
    <div id="clocks">
      <span class="clock" id="gameClock">3:00</span>
      <span class="clock" id="shotClock">24</span>
    </div>
    <div id="powerWrap">
      <div id="perfectZone"></div>
      <div id="powerFill"></div>
    </div>
    <div id="msg"></div>
    <div id="fps">-- FPS</div>
    <div id="hint">WASD 移动 · Shift 冲刺 · 左键蓄力投篮 · 右键传球 · 空格 跳跃/盖帽 · E 抢断</div>
  </div>

  <div id="menu">
    <h1>HOOPS <span>ARENA</span></h1>
    <p class="sub">半场 3D 篮球 · 单机对战 AI</p>
    <div>
      <div class="label">模式</div>
      <div class="optRow" id="modeRow">
        <div class="opt selected" data-mode="1v1">1v1 斗牛</div>
        <div class="opt" data-mode="3v3">3v3 街球</div>
      </div>
    </div>
    <div>
      <div class="label">AI 难度</div>
      <div class="optRow" id="diffRow">
        <div class="opt" data-diff="easy">简单</div>
        <div class="opt selected" data-diff="normal">普通</div>
        <div class="opt" data-diff="hard">困难</div>
      </div>
    </div>
    <button id="playBtn">开 始 比 赛</button>
    <div class="brand-note">Three.js 渲染 · 自研轻量物理 · 无外部依赖</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
